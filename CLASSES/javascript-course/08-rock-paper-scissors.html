<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <!--Rock-->
    <button onclick="
     playGame('rock');
    ">Rock</button>

    <!--Paper-->
    <button onclick="
      playGame('paper');
    ">Paper</button>

    <!--Scissors-->
    <button onclick="
      playGame('scissors')
     ">Scissors</button>

    <!--Reset-->
    <button onclick="
     score.wins = 0;
     score.losses = 0;
     score.ties = 0;
     localStorage.removeItem('score');
    ">Reset Score</button>

    <script>
      //JSON.parse converts JSON to OBJ
      //restablish OBJ var 'score' on each load
      //OBJ DNE -> "||" -> set default values
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      //06192025 - TJS - review , experimenting
       //score={wins: 0, losses: 0, ties: 0};
      
      /* no longer necessary due to above snippet after "||"
      if (!score){
        score = { 
          wins: 0,
          losses: 0,
          ties: 0
        }
      }*/
  
      console.log(localStorage.getItem('score'));
      function playGame(playerMove){
        const computerMove=pickComputerMove();
        let result=''
        if (playerMove === 'scissors')
        {
          if (computerMove === 'rock'){
            result='You lose.';
          } else if (computerMove === 'paper'){
            result='You win.';
          } else if (computerMove === 'scissors'){
            result='tie';
          }
        } else if (playerMove === 'paper') {
          if (computerMove === 'rock'){
            result='You win.';
          } else if (computerMove === 'paper'){
            result='tie';
          } else if (computerMove === 'scissors'){
            result='You lose.';
          }
        }  else if (playerMove === 'rock'){
            if (computerMove === 'rock'){
                  result='tie';
            } else if (computerMove === 'paper'){
                  result='You lose.';
            } else if (computerMove === 'scissors'){
                  result='You win.';
            }
          }     
      if (result === 'You win.'){
        score.wins +=1;
      } else if (result === 'You lose.'){
        score.losses +=1;
      } else if (result === 'tie'){
        score.ties += 1;
      }
      
      // JSON.stringify converts OBJECT to JSON 
      // JSON can be stored in localStorage
      localStorage.setItem('score', JSON.stringify(score));

      alert(`You picked ${playerMove}.Computer picked ${computerMove}. ${result} 
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`)
      console.log(result);
      } //playGame

      function pickComputerMove(){
        const randomNumber=Math.random();
        let computerMove='';
        if(randomNumber >= 0 && randomNumber < 1/3){
          computerMove ='rock';
        } 
        else if (randomNumber >= 1/3 && randomNumber < 2/3)
        {
          computerMove ='paper';
        } 
        else {
          computerMove ='scissors';
        }
        return computerMove;
      }
       
    </script>
  </body>
</html>
