<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>

  </head>

  <body>
    
    <script>
     // create function to remove "egg" from an array and return an array

     function removeEgg(foods){
      let newlist=[];
      for( let i=0; i < foods.length; i++){
        if (foods[i] !== 'egg'){
          newlist.push(foods[i]);
        }
      }//for
       return newlist;
     } //removeEgg

     console.log(removeEgg(['egg','apple','egg','egg','ham']))

     function removeEggFirst2(foods){
      let newlist=[];
      let eggCounter=0;
      for( let i=0; i < foods.length; i++){
        
        if (foods[i] === 'egg'){
          eggCounter++;
          if (eggCounter >2){
            newlist.push(foods[i]);
          }
        }
        else{
          newlist.push(foods[i]);
        }
      }//for
       return newlist;
     } //removeEggFirst2
    
     console.log(removeEggFirst2(['egg','apple','egg','egg','ham']))

     function removeEggApprovedSOLUTION(foods) {
        // 0401-2025 this is the solution from the teacher 
        const result = [];
        let eggsRemoved = 0;

        for (let i = 0; i < foods.length; i++) {
          // Only skip 'egg' if we removed less than 2
          // of them so far.
          if (foods[i] === 'egg' && eggsRemoved < 2) {
            // Update the number of 'egg' we have removed.
            // This must be done before continue, otherwise,
            // doing continue first will just skip this code.
            eggsRemoved++;
            continue;
          }

          result.push(foods[i]);
        }

        return result;
      }
      console.log(removeEggApprovedSOLUTION(['egg','apple','egg','egg','ham']))
    </script>
  </body>
</html>
