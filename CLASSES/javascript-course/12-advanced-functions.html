     // classic function
     const regularFunction = function(){
      console.log('hello');
     }

     // arrow function
     const arrowFunction = () => {
      console.log('hello dude');
     }
     arrowFunction();

     //arrow function with optional parameter
     const oneParm = param => {
      console.log(param +1);
     }
     oneParm(2);

     //arrow function, one line so {} optional
     const oneLine = () => 2 +3;
     console.log(oneLine());

     // short method of function within an object
     const object2  = {

      }

     // use .filter to return only positive numbers of an array inputted
     console.log([1, -2, 8,3].filter((value, index) => 
     {
      return value >= 0; 
      // line above ^ equivalent to 5 lines below
      if (value >= 0) {
        return true;
      } else {
        return false;
      }
     })) 

     // use .map to return array doubling each value of array inputted
     console.log([1, 1, 3].map((value,index) => {return value *2}));
     
     // short cut version of the lines above ^
     console.log([1, 1, 3].map(value => value *2));
