<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles\10-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <!--Rock-->
    <button 
      class="move-button";
      onclick="
      playGame('rock');
     "><img src=".\images\rock-emoji.png" class="move-icon">
     </button>

    <!--Paper-->
    <button 
      class="move-button";
      onclick="
      playGame('paper');
    "><img src=".\images\paper-emoji.png" class="move-icon"></button>

    <!--Scissors-->
    <button 
      class="move-button";
      onclick="
      playGame('scissors')
     "><img src=".\images\scissors-emoji.png" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves">
      
    </p>

     <p class="js-score score"></p>

    <!--Reset-->
    <button onclick="
     score.wins = 0;
     score.losses = 0;
     score.ties = 0;
     localStorage.removeItem('score');
     localStorage.setItem('score', JSON.stringify(score));
     updateScoreElement();"
     class="reset-score-button"
     >Reset Score</button>

    <script src="scripts\10-rock-paper-scissors.js">
 
    </script>
  </body>
</html>
