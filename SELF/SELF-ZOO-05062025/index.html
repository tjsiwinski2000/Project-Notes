<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Animals</title>
    <!-- Styling for the client UI -->
    <style>
    h1 {
        color: #FFFFFF;
        font-family: system-ui;
		margin-left: 20px;
        }
	body {
        background-color: #222629;
        }
    label {
        color: #86C232;
        font-family: system-ui;
        font-size: 20px;
        margin-left: 20px;
		margin-top: 20px;
        }
     button {
        background-color: #86C232;
		border-color: #86C232;
		color: #FFFFFF;
        font-family: system-ui;
        font-size: 20px;
		font-weight: bold;
        margin-left: 30px;
		margin-top: 20px;
		width: 140px;
        }
	 input {
        color: #222629;
        font-family: system-ui;
        font-size: 20px;
        margin-left: 10px;
		margin-top: 20px;
		width: 100px;
        }
    </style>
    <script>
        // callAPI function that takes the base and exponent numbers as parameters
        var callAPI = (base,exponent)=>{
            // instantiate a headers object
            var myHeaders = new Headers();
            // add content type header to object, added Access-Control* 0508-2025 removed 925pm
            myHeaders.append("Content-Type", "application/json");
           // myHeaders.append("Access-Control-Allow-Origin" , "*");
            //myHeaders.append("Access-Control-Allow-Credentials" ,true)
            // using built in JSON utility package turn object to string and store in a variable
            var raw = JSON.stringify({"ID":base,"exponent":exponent});
            // create a JSON object with parameters for API call and store in a variable
            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: raw,
                redirect: 'follow'
            };
            // make API call with parameters and use promises to get response
            fetch("https://ocoqgalqhk.execute-api.us-west-1.amazonaws.com/dev", requestOptions)
            .then(response => response.text())
            .then(result => alert(JSON.parse(result).body))
            .catch(error => console.log('error', error));
        }
        function prepCallAPI(base,exponent){
            alert(base);
            alert(exponent);
            //0531 0508-2025 above ^ lines execute
            callAPI(base, exponent)
        }
    </script>
</head>
<body>
    <h1>Animals!05082025</h1>
	<form>
        <label>ID (Base) :</label>
        <input type="text" id="base">
        <label>...to the power of:</label>
        <input type="text" id="exponent">
        <!-- set button onClick method to call function we defined passing input values as parameters -->
        <button type="button" onclick="prepCallAPI(document.getElementById('base').value, document.getElementById('exponent').value)">CALCULATE</button>
    </form>
</body>
</html>
