<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .data-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Data from AWS API Gateway</h1>
    <button id="loadData">Load Data</button>
    <div class="data-container" id="dataContainer"></div>

    <script>
        document.getElementById('loadData').addEventListener('click', fetchData);

        async function fetchData() {
            const apiUrl = 'https://1z02i6c3v1.execute-api.us-west-1.amazonaws.com/dev'; // Your API Gateway URL

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                // Process and display the data
                displayData(data);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function displayData(data) {
            const dataContainer = document.getElementById('dataContainer');
            dataContainer.innerHTML = ''; // Clear previous data

            if (Array.isArray(data)) {
                data.forEach(item => {
                    const p = document.createElement('p');
                    p.textContent = JSON.stringify(item); // Display data as string
                    dataContainer.appendChild(p);
                });
            } else {
                const p = document.createElement('p');
                p.textContent = JSON.stringify(data); // Display single data object
                dataContainer.appendChild(p);
            }
        }
    </script>
</body>
</html>
