<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GRID PROJECT 072025</title>
    <!-- Styling for the client UI -->
    <style>
    h1 {
        color: #FFFFFF;
        font-family: system-ui;
		margin-left: 20px;
        }
    h2 {
        color: #FFFFFF;
        font-family: system-ui;
        margin-left: 20px;
        }
	body {
        background-color: #222629;
        }
    label {
        color: #86C232;
        font-family: system-ui;
        font-size: 20px;
        margin-left: 20px;
		margin-top: 20px;
        }
     button {
        background-color: #86C232;
		border-color: #86C232;
		color: #FFFFFF;
        font-family: system-ui;
        font-size: 20px;
		font-weight: bold;
        margin-left: 30px;
		margin-top: 20px;
		width: 140px;
        height: 70px;
        display: inline-block;
        vertical-align: middle;

        font-family: system-ui;

    </style>
</head>
    <body>
        <h1>GRID PROJECT 072025</h1>
        <form>
            <!-- set button onClick method to call RETRIEVE-ALL function  -->
            <button type="button" onclick="retrieveRecordsFromDatabase()">SHOW ALL ENTRIES</button>
            <button type="button" onclick="addEntry()">ADD ENTRIES</button>
            <!--<p  style="font-size:50px;color:white" class="js-problems" ></p> -->
            <!--<table style="font-size:50px;color:white" class="js-grid-output" border ="1"></table> -->
        </form>
        <div id="editFormContainer" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
            <h2>Edit the Entry</h2>
            <form id="editForm">
              <label for="editUuid">UUID:</label><br>
              <input type="text" id="editUuid" name="uuid" readonly size =50 style="background-color:gray"><br><br>

              <label for="editContent">Content:</label><br>
              <input type="text" id="editContentInput" name="Content" size= 110><br><br>
          
              <label for="editAuthor">Name:</label><br>
              <input type="text" id="editAuthor" name="author" size= 50><br><br>
     
              <button type="submit">Save Changes</button>
              <button type="button" id="cancelEdit">Cancel</button>
            </form>
          </div>
          <div id="addFormContainer" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
            <h2>Add Entry</h2>
            <form id="addForm">
              <label for="addContent">Content:</label><br>
              <input type="text" id="addContentInput" name="Content" size= 110><br><br>
          
              <label for="addAuthor">Name:</label><br>
              <input type="text" id="addAuthor" name="author" size= 50><br><br>
     
              <button type="submit">Save Changes</button>
              <button type="button" id="cancelAdd">Cancel</button>
            </form>
          </div>  
          <table style="font-size:50px;color:white" class="js-grid-output" border ="1">
        <script>
            // global var to hold current contents
            let tableDataObject ;
            // Get references to the *edit* form elements and container
            const editFormContainer = document.getElementById("editFormContainer");
            const editForm = document.getElementById("editForm");
            const editUuidInput = document.getElementById("editUuid");
            const editAuthorInput = document.getElementById("editAuthor");
            const editContentInput = document.getElementById("editContentInput");
            const cancelEditButton = document.getElementById("cancelEdit");
            // Get references to the *add* form elements and container
            const addFormContainer = document.getElementById("addFormContainer");
            const addForm = document.getElementById("addForm");
            const addAuthorInput = document.getElementById("addAuthor");
            const addContentInput = document.getElementById("addContentInput");
            const cancelAddButton = document.getElementById("cancelAdd");

            // 
            async function addEntry() {
                console.log("start-addEntry");
                addFormContainer.style.display = "block"
                console.log("end-addEntry");
            }
            // callAPI function 
            async function retrieveRecordsFromDatabase() {
                console.log("start-retrieveRecordsFromDatabase");
                try {
                    const response = await fetch('https://497i5a1fgf.execute-api.us-east-1.amazonaws.com/dev/posts/all');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
            
                    const data = await response.text(); // or use .json() if the response is JSON
                    const resultString = data;
                    // initial global var with values pulled from API, convert to object 
                    tableDataObject=data;
                    tableDataObject = JSON.parse(tableDataObject);
                    displayRecordsInHTMLtable(resultString);
                    //return resultString;
                    console.log("end-retrieveRecordsFromDatabase");
            
                } catch (error) {
                    console.error("Error calling AWS API:", error);
                    return null;
                }
                
            } //retrieveRecordsFromDatabase

            function displayRecordsInHTMLtable(apiInput){
                console.log(apiInput);
                console.log("---------------------")               
                const todos = JSON.parse(apiInput);
                const delimitor_cell="</td><td>";
                let gridOutput="";
                

                todos.forEach(element => {
                    let temp="";
                    let row="<tr><td>";
                    row += createIDlink(element.id) + delimitor_cell;
                    row += element.content + delimitor_cell;
                    row += (element.author || 'N/A') +delimitor_cell;
                    if (element.createdAt) {temp=convertToShortDate(element.createdAt) } else {temp="N/A"}
                    row += (temp) +delimitor_cell;
                    if (element.updatedAt) {temp=convertToShortDate(element.updatedAt) } else {temp="N/A"}
                    row += (temp) + "</td></tr>";
                    console.log(row);
                    gridOutput +=row;
                });
                // update table with API output 
                document.querySelector('.js-grid-output').innerHTML=gridOutput;
            } //displayRecordsInHTMLtable

            function convertToShortDate(dateTimeString) {
                const date = new Date(dateTimeString);
                const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
                return date.toLocaleDateString('en-US', options);
            } //convertToShortDate

            function createIDlink(id) {
                //create hyperlink with abbreviated uuid
                let displayID=id.substring(0,8);
                let link="<a href='#' onclick=showID('" + id + "')>" + displayID + "</a>";
                return link;
            }

            function showID(idNumber) {
                console.log("Starting edit process for Identification Number: " + idNumber + " may the force be with you.");
                // find corresponding entry in global-object
                const entryToEdit = tableDataObject.find(item => item.id === idNumber);
                console.log(entryToEdit);

                //Populate the form fields with entry's data
                if (entryToEdit) {
                    editUuidInput.value = entryToEdit.id;
                    editAuthorInput.value = entryToEdit.author;
                    editContentInput.value = entryToEdit.content;
                    //alert("found " + entryToEdit.content);
                    // Display the form
                    editFormContainer.style.display = "block"
                }

            }

            
            editForm.addEventListener("submit", async function(event) { // Make the function async
                event.preventDefault(); // Prevent default form submission
              
                // Get updated values from the form
                const updatedAuthor = editAuthorInput.value;
                const updatedContent = editContentInput.value; 
              
                // Create an object with the data to send to your API
                const updatedData = {"author": updatedAuthor,
                  "content": updatedContent};
                console.log("about to log data object");
                console.log(updatedData);
                console.log("finished logging data object")
                const updatedDataAsString=JSON.stringify(updatedData);
                console.log("about to log data string")
                console.log(updatedDataAsString);
                console.log("finished logging updated data string")
                try {
                  // 1. Make the API call to update the database
                   const response = await fetch(`https://497i5a1fgf.execute-api.us-east-1.amazonaws.com/dev/posts/update/${editUuidInput.value}`, { 
                    method: 'PUT', 
                    headers: {
                      'Content-Type': 'application/json',
                      //"Access-Control-Allow-Origin": "*",
                      //"Access-Control-Allow-Methods": "PUT,GET,POST,OPTIONS"
                      // Add any necessary authentication headers (e.g., 'Authorization': 'Bearer YOUR_TOKEN')
                    },
                    body: updatedDataAsString // Send the updated data as JSON
                  });
              
                  // 2. Check if the API request was successful
                  if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                  }
              
                  // 3. Parse the response 
                  const result = await response;
                  console.log('API update successful:', result);
              
                  editFormContainer.style.display = "none"; // Make edit form invisible
                  editForm.reset(); // Clear form fields
                  retrieveRecordsFromDatabase(); // update User Interface with the latest data
                  alert("Entry updated successfully!");
              
                } catch (error) {
                  console.error('Error updating entry:', error);
                  alert('Failed to update entry. Please try again. ' + error.message);
                  // Optionally, re-enable the form fields or show a specific error message on the form
                }
              }); //editForm.addEventListener

           
            addForm.addEventListener("submit", async function(event) { // Make the function async
                    event.preventDefault(); // Prevent default form submission
                     // Get  values from the form
                    const addAuthor = addAuthorInput.value;
                    const addContent = addContentInput.value; 
                     // Create an object to send to  API
                    const addData = {"author": addAuthor,
                    "content": addContent};
                    console.log("about to log add-data object");
                    console.log(addData);
                    console.log("finished logging add-data object")
                    const addDataAsString=JSON.stringify(addData);
                    console.log("about to log add-data string")
                    console.log(addDataAsString);
                    console.log("finished logging updated add-data string")
                    try {
                        // 1. Make the API call to update the database
                         const response = await fetch(`https://497i5a1fgf.execute-api.us-east-1.amazonaws.com/dev/posts/create`, { 
                          method: 'POST', 
                          headers: {
                            'Content-Type': 'application/json',
                            //"Access-Control-Allow-Origin": "*",
                            //"Access-Control-Allow-Methods": "PUT,GET,POST,OPTIONS"
                            // Add any necessary authentication headers (e.g., 'Authorization': 'Bearer YOUR_TOKEN')
                          },
                          body: addDataAsString // Send the updated data as JSON
                        });
                   
                     // 2. Check if the API request was successful
                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                        }

                        // 3. Parse the response 
                        const result = await response;
                        console.log('API update successful:', result);

                        addFormContainer.style.display = "none"; // Make edit form invisible
                        addForm.reset(); // Clear form fields
                        retrieveRecordsFromDatabase(); // update User Interface with the latest data
                        alert("Entry updated successfully!");
                    } //try
                    catch (error) {
                    console.error('Error updating entry:', error);
                    alert('Failed to update entry. Please try again. ' + error.message);
                    } //catch
            });//addForm.addEventListener
            
            
            cancelAddButton.addEventListener("click", function() {
                addFormContainer.style.display = "none"; // Make the form invisible
            });

            </script>

    </body>



</html>
