        <script>
            // callAPI to return sunrise, sunset for SA Texas
            var callAPI = (base,exponent)=>{
                 // instantiate a headers object
                 var myHeaders = new Headers();
                 // add content type header to object
                 myHeaders.append("Content-Type", "application/json");
                 // using built in JSON utility package turn object to string and store in a variable
                 var raw = JSON.stringify({"var1":2,"var2":3});
                 // create a JSON object with parameters for API call and store in a variable
                 var requestOptions = {
                     method: 'POST',
                     headers: myHeaders,
                     body: raw,
                     redirect: 'follow'
                 };
                // make API call with parameters and use promises to get response
                fetch("https://2lms7e2tk8.execute-api.us-west-1.amazonaws.com/DEV", requestOptions)
                .then(response => response.text())
                //.then(result => alert(JSON.parse(result).body))
                .then(result => displayAPIoutput(JSON.parse(result).body))
                .catch(error => console.log('error', error));
                
            }

                    //})
                //problemReport =String(problemReport).replaceAll('"','');
                //console.log ('****foo**\n' + problemReport);
                const apiParsedInput=JSON.parse(apiInput);

                console.log(sunrise)
                const sunset = apiParsedInput.data.results.sunset
                console.log(sunset)
                document.querySelector('.js-problems').innerHTML="🌄 : " + sunrise + "<br> 🌅:" + sunset +"<br>RAW DATA:" + apiInput;
